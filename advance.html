<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styleadvance.css">
    <title>Busqueda Avanzada</title>
</head>
<body>
    <header>
    <nav class="navbar">
      <ul class="items">
        <li><a href="index.html">Google</a></li>
        <li><a href="images.html">Imagenes</a></li>
      </ul>
    </nav>
  </header>

  <div class="h1-container">
    <h1>Búsqueda avanzada</h1>
  </div>
  <div class="divider-1"></div>

  <main>
    <form action="https://www.google.com/search" method="get">
        <div class="inputs-container">
            <div class="input-group">
                <span>Mostrar páginas que contengan...</span>
            </div>
            <div class="input-group">
                <label for="01">todas estas palabras:</label>
                <input class="form-input" id="01" type="text" name="as_q">
            </div>
            <div class="input-group">
                <label for="02">esta palabra o frase exacta:</label>
                <input class="form-input" id="02" type="text" name="as_epq">
            </div>
            <div class="input-group">
                <label for="03">cualquiera de estas palabras:</label>
                <input class="form-input" id="03" type="text" name="as_oq">
            </div>
            <div class="input-group">
                <label for="04">ninguna de estas palabras:</label>
                <input class="form-input" id="04" type="text" name="as_eq">
            </div>
        </div>
        <div class="button-container">
            <div class="button-div">
                <input type="submit" value="Búsqueda avanzada">
            </div>
        </div>
    </form>

  <div class="divider"></div>
  </main>

  <div class="tmb">
    <div class="tmb-1">
        <span>También puedes...</span>
    </div>
    <div class="tmb-2">
        <ul>
            <li><a href="https://support.google.com/websearch/answer/2466433?visit_id=638883167768505188-3990750928&p=adv_pages_similar&hl=es-419&rd=1">Buscar páginas similares a la URL</a></li>
            <li><a href="https://support.google.com/websearch/answer/54068?hl=es-419&visit_id=638883167768505188-3990750928&p=adv_pages_visited&rd=1">Buscar páginas visitadas</a></li>
            <li><a href="https://support.google.com/websearch/answer/2466433?visit_id=638883167768505188-3990750928&p=adv_operators&hl=es-419&rd=1">Usar los operadores del cuadro de búsqueda</a></li>
            <li><a href="https://www.google.com/preferences?hl=es-419">Personalizar la configuración de busqueda</a></li>
        </ul>
    </div>
  </div>

  <footer>
    <div class="idk">
      Nicaragua
    </div>
    <div class="section-container">
      <div class="section-1">
        <a href="https://support.google.com/websearch/?visit_id=638883167765190573-2202153286&hl=es-419&rd=2#topic=3378866">Ayuda</a>
        <a href="https://policies.google.com/privacy?hl=es-419&fg=1">Privacidad</a>
        <a href="https://policies.google.com/terms?hl=es-419&fg=1">Condiciones</a>
      </div>
    </div>
  </footer>
</body>
</html>
